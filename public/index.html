<style>
/* Layout: one-screen app. Azimuthal-equidistant map centred on Kuwait City fills the stage; story rail beside it (below it on phones). Arabic first, right-to-left. */
:root{
  --sea:#e6e1d6; --land:#cfc4ad; --land-line:#b7aa8f; --kw:#c48a2c;
  --ink:#1d2430; --ink-2:#5a6170; --ink-3:#8a8f99; --rule:#d6d0c2;
  --panel:#f6f3ec; --chip:#ebe6da; --ring:#9a8f78; --sel:#1d2430; --live:#1f8a5b;
  --fin:#1f8a5b; --pol:#3a63d6; --war:#d33a2f; --cri:#d9822b; --crm:#8e4fc4;
  --f-display:"Bricolage Grotesque","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono","IBM Plex Sans Arabic",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
/* night follows the phone's setting until the viewer picks day or night with the switch */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0f1620; --land:#1f2a37; --land-line:#2e3b4b; --kw:#e2a64a;
  --ink:#e8e4da; --ink-2:#a9adb6; --ink-3:#737a86; --rule:#26313f;
  --panel:#131b26; --chip:#1c2633; --ring:#4a5768; --sel:#f3efe6; --live:#3fbf86;
  --fin:#3fbf86; --pol:#6d8fff; --war:#ff5a4c; --cri:#f2a14a; --crm:#b682ee;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0f1620; --land:#1f2a37; --land-line:#2e3b4b; --kw:#e2a64a;
  --ink:#e8e4da; --ink-2:#a9adb6; --ink-3:#737a86; --rule:#26313f;
  --panel:#131b26; --chip:#1c2633; --ring:#4a5768; --sel:#f3efe6; --live:#3fbf86;
  --fin:#3fbf86; --pol:#6d8fff; --war:#ff5a4c; --cri:#f2a14a; --crm:#b682ee;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--panel);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
:lang(en) body,body:lang(en){font-family:"IBM Plex Sans",system-ui,sans-serif}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:auto minmax(0,1fr);
  padding-top:env(safe-area-inset-top,0px)}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:10px;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--rule)}
.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1;direction:ltr}
.brand b{color:var(--kw)}
.tag{color:var(--ink-2);font-size:13px}
.search{position:relative;flex:1 1 200px;max-width:300px;min-width:0}
.search input{width:100%;border:1px solid var(--rule);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 14px;font:500 13px var(--f-body);outline:none}
.search input:focus{border-color:var(--kw)}
.search input::placeholder{color:var(--ink-3)}
.qres{position:absolute;top:calc(100% + 4px);inset-inline:0;z-index:30;list-style:none;margin:0;padding:4px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-height:320px;overflow-y:auto}
.qres li{display:flex;align-items:baseline;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer}
.qres li[aria-selected="true"],.qres li:hover{background:var(--chip)}
.qres .k{margin-inline-start:auto;font-size:11px;color:var(--ink-3)}
.qres .o{font-size:12px;color:var(--ink-2)}
.qres .none{color:var(--ink-3);cursor:default}
.plabel{font-family:var(--f-body);fill:var(--ink-2);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--sea);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.plabel.country{font-size:11px;font-weight:600;fill:var(--ink-2);letter-spacing:.02em}
.plabel.city{font-size:10px;fill:var(--ink)}
.plabel.focus{font-size:13px;font-weight:700;fill:var(--ink)}
.cdot{fill:var(--ink-2);pointer-events:none}
.land.dim,.kw.dim{opacity:.25}
.land.focus,.kw.focus{stroke:var(--kw);stroke-width:1.5}
.marker.faded{opacity:.18}
.ring.faded,.spoke.faded{opacity:.15}
.status{margin-inline-start:auto;font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.status.live i{background:var(--live);box-shadow:0 0 0 0 var(--live)}
@media (prefers-reduced-motion:no-preference){.status.live i{animation:beat 2s infinite}}
@keyframes beat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 60%,transparent)}100%{box-shadow:0 0 0 7px transparent}}
.status.err i{background:var(--war)}
.hbtns{display:flex;gap:6px;align-items:center}
.theme{border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:999px;width:32px;height:28px;display:grid;place-items:center;cursor:pointer;padding:0}
.theme:focus-visible{outline:2px solid var(--kw);outline-offset:2px}
.lang{border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:999px;padding:4px 12px;font:600 12.5px var(--f-body);cursor:pointer}
.stage{position:relative;min-width:0;min-height:0;background:var(--sea);overflow:hidden}
svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg#map:active{cursor:grabbing}
.land{fill:var(--land);stroke:var(--land-line);stroke-width:.5}
.kw{fill:var(--kw)}
.sphere{fill:var(--sea);stroke:var(--ring);stroke-width:1}
.grat{fill:none;stroke:var(--rule);stroke-width:.4}
.ring{fill:none;stroke:var(--ring);stroke-width:.8;opacity:.8}
.ring.hot{stroke:var(--kw);opacity:1}
.spoke{stroke:var(--ring);stroke-width:.6;opacity:.45}
.ringlabel{font-family:var(--f-mono);font-size:10px;fill:var(--ink-2);paint-order:stroke;stroke:var(--sea);stroke-width:3px}
.compass{font-family:var(--f-body);font-weight:700;fill:var(--ink-3);text-anchor:middle;dominant-baseline:central}
.route{fill:none;stroke:var(--sel)}
.marker{cursor:pointer}
.marker .halo{fill:var(--sea);opacity:.85}
.marker text{font-family:var(--f-mono);font-size:10px;text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:var(--ink)}
.marker.sel .halo{fill:var(--sel);opacity:1}
.marker.fresh .halo{stroke:var(--kw);stroke-width:1.5}
.marker:focus{outline:none}.marker:focus-visible .halo{fill:var(--sel)}
.centre circle{fill:var(--kw)}
.centre .pulse{fill:none;stroke:var(--kw);stroke-width:1.5}
@media (prefers-reduced-motion:no-preference){.centre .pulse{animation:pulse 2.4s ease-out infinite}}
@keyframes pulse{from{r:6;opacity:.9}to{r:22;opacity:0}}
.mapctl{position:absolute;inset-inline-end:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.mapctl button,.legend{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:8px}
.mapctl button{min-width:36px;height:36px;font-size:18px;cursor:pointer;font-family:var(--f-body)}
.mapctl button.txt{padding:0 10px;font-size:12px;font-weight:600}
.legend{position:absolute;inset-inline-start:12px;bottom:12px;padding:8px 10px;font-size:11.5px;color:var(--ink-2);max-width:calc(100% - 110px)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:6px 9px;font-size:12px;max-width:260px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.tip .g{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
aside{min-width:0;min-height:0;display:flex;flex-direction:column;border-inline-start:1px solid var(--rule)}
.controls{display:flex;flex-direction:column;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 10px;font:500 12.5px var(--f-body);cursor:pointer}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:transparent}
.chip:focus-visible,.seg button:focus-visible,.story:focus-visible,.mapctl button:focus-visible,.lang:focus-visible{outline:2px solid var(--kw);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.lbl{font-size:12px;color:var(--ink-3);font-weight:600}
:lang(en) .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--ink-2);padding:5px 9px;font:500 12px var(--f-body);cursor:pointer}
.seg button+button{border-inline-start:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.list{overflow-y:auto;flex:1;min-height:0}
.empty{padding:24px 16px;color:var(--ink-2);line-height:1.6}
.story{display:grid;grid-template-columns:4px minmax(0,1fr);gap:0 12px;padding-block:12px;padding-inline:12px 16px;border-bottom:1px solid var(--rule);cursor:pointer}
.story .bar{border-radius:2px}
.story h3{margin:0;font-size:14.5px;font-weight:500;line-height:1.55;text-wrap:pretty}
:lang(en) .story h3{font-size:14px;line-height:1.38}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:12px;color:var(--ink-2);align-items:baseline}
.meta .cat{font-weight:700;font-size:11.5px}
:lang(en) .meta .cat{text-transform:uppercase;letter-spacing:.05em;font-size:10.5px}
.meta .geo{font-family:var(--f-mono);font-size:11.5px;color:var(--ink);margin-inline-start:auto;white-space:nowrap}
.story.sel{background:var(--chip)}
:lang(ar) .meta .geo,:lang(ar) .ringlabel,:lang(ar) .chip .n,:lang(ar) .marker text{font-family:var(--f-body)}
:lang(ar) .meta .geo{font-size:12px}
/* story panel: right side of the map on desktop, top of the map on phones */
.detail{position:absolute;top:12px;right:12px;width:min(360px,calc(100% - 24px));max-height:calc(100% - 24px);display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--rule);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.22);z-index:5;overflow:hidden}
.detail .dh{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px;border-bottom:1px solid var(--rule)}
.detail .dcat{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px}
.detail .dcat i{width:9px;height:9px;border-radius:50%;display:inline-block}
.detail .dgeo{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
:lang(ar) .detail .dgeo{font-family:var(--f-body);font-size:12px}
.detail .dbtns{margin-inline-start:auto;display:flex;gap:6px}
.detail .dbtns button{width:32px;height:32px;border-radius:8px;border:1px solid var(--rule);background:var(--chip);color:var(--ink);font-size:16px;line-height:1;cursor:pointer;display:grid;place-items:center}
.detail .dbtns button:focus-visible{outline:2px solid var(--kw);outline-offset:2px}
.detail .dbtns .tog svg{transition:transform .2s}
.detail.collapsed .dbtns .tog svg{transform:rotate(180deg)}
.detail .dt{margin:0;padding:12px 14px 0;font-size:16px;font-weight:600;line-height:1.5;text-wrap:pretty}
.detail.collapsed .dt{padding-bottom:12px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail .db{padding:8px 14px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.detail.collapsed .db{display:none}
.detail .dmeta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px}
.detail .dread{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--panel);text-decoration:none;font-weight:600;padding:8px 12px;border-radius:8px}
.dropbtn{display:none}
.groupbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--chip);border-bottom:1px solid var(--rule);font-weight:600;font-size:13.5px}
.groupbar span{flex:1;min-width:0}
.groupbar button{border:1px solid var(--rule);background:var(--panel);color:var(--ink);border-radius:999px;padding:5px 12px;font:600 12.5px var(--f-body);cursor:pointer;white-space:nowrap}
.groupbar button:focus-visible{outline:2px solid var(--kw);outline-offset:2px}
.new-badge{font-size:10.5px;font-weight:700;color:var(--kw)}
.foot{padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--rule);line-height:1.6}
.foot .off{text-decoration:line-through;opacity:.7}
/* phone filters sit on the map: categories top-right, distance and sort top-left */
.mapfilters{display:none}
.mf{position:absolute;top:8px;display:flex;gap:6px;z-index:4}
.mf.r{right:8px}.mf.l{left:8px}
.mf select{appearance:none;-webkit-appearance:none;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:999px;
  font:600 13px var(--f-body);padding:7px 26px 7px 12px;max-width:44vw;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:right 12px center,right 7px center;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
:root[dir="rtl"] .mf select{padding:7px 12px 7px 26px;background-position:left 7px center,left 12px center}
.mf select:focus-visible{outline:2px solid var(--kw);outline-offset:2px}
@media (max-width:820px){
  /* phone: the map stays pinned at the top; only the news list scrolls */
  body{overflow:hidden}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 40% minmax(0,1fr)}
  aside{border-inline-start:0;border-top:1px solid var(--rule);min-height:0}
  aside .controls{display:none}
  .drop{display:flex;flex-direction:column;min-height:0;flex:1}
  .list{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .mapfilters{display:block}
  .legend{display:none}
  .detail{top:8px;left:8px;right:8px;width:auto;max-height:calc(100% - 16px)}
  /* map buttons: a slim column down the left edge, under the filters */
  .mapctl{flex-direction:column;left:8px;right:auto;top:52px;bottom:auto;gap:4px}
  .mapctl button{min-width:30px;height:30px;font-size:15px;border-radius:7px}
  .mapctl button.txt{padding:0 6px;font-size:10.5px}
  .mf select{font-size:12px;padding-block:5px}
  .search{flex-basis:100%;max-width:none;order:5}
  .hbtns{margin-inline-start:auto}
  .status{order:4;flex-basis:100%;margin-inline-start:0;font-size:11px}
  .status span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .foot{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-block:6px;font-size:11px}
  header{padding-block:6px}
}
@media (min-width:821px){.drop{display:flex;flex-direction:column;min-height:0;flex:1}}

</style>
</head>

  <header>

function renderQ(){qres.innerHTML="";qres.hidden=!qEl.value.trim();qEl.setAttribute("aria-expanded",String(!qres.hidden));if(qres.hidden)return;
  if(!qItems.length){const li=document.createElement("li");li.className="none";li.textContent=t().noPlace;qres.append(li);return}
  qItems.forEach((p,i)=>{const li=document.createElement("li");li.setAttribute("role","option");li.setAttribute("aria-selected",String(i===qIdx));
    const m=document.createElement("span");m.textContent=p.via||(lang==="ar"?p.ar:p.name);const o=document.createElement("span");o.className="o";o.textContent=p.via?(lang==="ar"?p.ar:p.name):(lang==="ar"?p.name:p.ar);
    const k=document.createElement("span");k.className="k";k.textContent=p.kind==="country"?t().kCountry:p.kind==="kuwait"?t().kArea:t().kCity;
    li.append(m,o,k);li.onmousedown=e=>{e.preventDefault();choosePlace(p)};qres.append(li)})}
qEl.addEventListener("input",()=>{qItems=searchPlaces(qEl.value);qIdx=qItems.length?0:-1;renderQ()});
qEl.addEventListener("keydown",e=>{if(e.key==="ArrowDown"){qIdx=Math.min(qItems.length-1,qIdx+1);renderQ();e.preventDefault()}
  else if(e.key==="ArrowUp"){qIdx=Math.max(0,qIdx-1);renderQ();e.preventDefault()}
  else if(e.key==="Enter"&&qItems[qIdx]){choosePlace(qItems[qIdx]);e.preventDefault()}
  else if(e.key==="Escape"){qres.hidden=true}});
qEl.addEventListener("blur",()=>setTimeout(()=>{qres.hidden=true;qEl.setAttribute("aria-expanded","false")},150));
qEl.addEventListener("search",()=>{if(!qEl.value&&state.group&&state.group.focus)clearGroup()});
const titleHas=(s,p)=>{const x=normQ(s.title);return [p.ar,p.name].some(n=>n&&normQ(n).length>2&&x.includes(normQ(n)))};
function choosePlace(p){
  qEl.value=p.via||(lang==="ar"?p.ar:p.name);qres.hidden=true;qEl.blur();
  const feat=p.kind==="country"&&FEATS?FEATS.find(f=>f.id===p.atlasId):null;
  const radius=p.kind==="kuwait"?15:p.kind==="place"?150:0;
  // stories placed inside the country (or near the city), plus any that name it in the headline
  const ids=new Set(state.stories.filter(s=>(feat?d3.geoContains(feat,[s.place.lon,s.place.lat]):hav(p.lat,p.lon,s.place.lat,s.place.lon)<=radius)||s.place.name===p.name||titleHas(s,p)).map(s=>s.id));
  state.group={ids,place:p.via||(lang==="ar"?p.ar:p.name),exact:true,focus:{...p,feat}};
  state.sel=null;gRoute.selectAll("*").remove();renderDetail();applyFocus();renderList();drawMarkers();drawLabels();listEl.scrollTop=0;
  if(feat){const b=path.bounds(largest(feat));const [[x0,y0],[x1,y1]]=b;zoomTo((x0+x1)/2,(y0+y1)/2,Math.max(1,Math.min(60,0.7/Math.max((x1-x0)/W,(y1-y0)/H))))}
  else{const c=proj([p.lon,p.lat]);zoomTo(c[0],c[1],Math.min(W,H)/2/kmPx(p.kind==="kuwait"?40:500))}
}
function select(id,fromList){
  state.sel=state.sel===id&&fromList?null:id;
  const s=state.stories.find(x=>x.id===id);gRoute.selectAll("*").remove();
  if(s&&state.sel!==null&&!isLocal(s)){
    gRoute.append("path").datum({type:"LineString",coordinates:[KW,[s.place.lon,s.place.lat]]}).attr("class","route").attr("d",path);restyle();
    if(fromList){const p=proj([s.place.lon,s.place.lat]),c=proj(KW);zoomTo((p[0]+c[0])/2,(p[1]+c[1])/2,Math.min(40,0.55/Math.max((Math.abs(p[0]-c[0])+20)/W,(Math.abs(p[1]-c[1])+20)/H)))}
  }else if(s&&state.sel!==null&&fromList)zoomToKm(260);
  state.collapsed=false;renderDetail();renderList();drawMarkers();
  if(state.sel!==null&&!fromList&&!isPhone()){const el=listEl.querySelector(`[data-id="${id}"]`);el&&el.scrollIntoView({block:"nearest",behavior:"smooth"})}
}
const zoom=d3.zoom().scaleExtent([1,120]).on("zoom",e=>{TR=e.transform;root.attr("transform",TR);restyle();drawLabels();drawMarkers();hideTip()});
svg.call(zoom).on("dblclick.zoom",null);
const RM=matchMedia("(prefers-reduced-motion: reduce)");
function zoomTo(x,y,k){svg.transition().duration(RM.matches?0:650).call(zoom.transform,d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-x,-y))}
function zoomToKm(km){const c=proj(KW);zoomTo(c[0],c[1],Math.min(W,H)/2/kmPx(km))}
function zoomWorld(){zoomTo(W/2,H/2,1)}
document.getElementById("zin").onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,1.8);
document.getElementById("zout").onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,1/1.8);
document.getElementById("zgulf").onclick=()=>zoomToKm(1300);
document.getElementById("zworld").onclick=()=>{state.range=Infinity;renderAll();zoomWorld()};

const isPhone=()=>matchMedia("(max-width:820px)").matches;
const detailEl=document.getElementById("detail"),asideEl=document.getElementById("aside");
function setDrop(open){asideEl.classList.toggle("open",open);document.getElementById("dropbtn").setAttribute("aria-expanded",String(open))}
document.getElementById("dropbtn").onclick=()=>setDrop(!asideEl.classList.contains("open"));
function renderDetail(){
  const s=state.sel!==null&&state.stories.find(x=>x.id===state.sel);
  detailEl.hidden=!s;if(!s)return;
  detailEl.classList.toggle("collapsed",!!state.collapsed);
  detailEl.querySelector(".dcat i").style.background=col(s.category);
  const dc=detailEl.querySelector(".dcat span");dc.textContent=t().cats[s.category];dc.parentElement.style.color=col(s.category);
  detailEl.querySelector(".dgeo").textContent=geoText(s);
  detailEl.querySelector(".dt").textContent=s.title;
  const m=detailEl.querySelector(".dmeta");m.textContent="";
  for(const x of [sourceName(s),ago(s.published),placeName(s)]){const sp=document.createElement("span");sp.textContent=x;m.append(sp)}
  const sum=detailEl.querySelector(".dsum");sum.textContent=s.summary||"";sum.hidden=!s.summary;
  detailEl.querySelector(".dplace").hidden=true;
  const a=detailEl.querySelector(".dread");a.href=s.url;a.textContent=t().readBtn(sourceName(s));
  const tog=document.getElementById("dtog");tog.setAttribute("aria-label",state.collapsed?t().expand:t().collapse);tog.title=tog.getAttribute("aria-label");
  const cl=document.getElementById("dclose");cl.setAttribute("aria-label",t().close);cl.title=t().close;
  detailEl.setAttribute("aria-label",s.title);
}
function closeDetail(){state.sel=null;gRoute.selectAll("*").remove();renderDetail();renderList();drawMarkers()}
document.getElementById("dclose").onclick=closeDetail;
document.getElementById("dtog").onclick=()=>{state.collapsed=!state.collapsed;renderDetail()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(asideEl.classList.contains("open"))setDrop(false);else if(state.sel!==null)closeDetail()}});
function opt(sel,v,label,on){const o=document.createElement("option");o.value=v;o.textContent=label;o.selected=on;sel.append(o)}
function renderPhoneFilters(){
  const inRange=state.stories.filter(s=>s.km<=state.range),all=state.cats.size===Object.keys(CATV).length;
  const c=document.getElementById("fcat");c.innerHTML="";c.setAttribute("aria-label",lang==="ar"?"التصنيف":"Category");
  opt(c,"all",`${t().all} (${nf().format(inRange.length)})`,all);
  for(const k in CATV)opt(c,k,`${t().cats[k]} (${nf().format(inRange.filter(s=>s.category===k).length)})`,!all&&state.cats.size===1&&state.cats.has(k));
  const r=document.getElementById("frange");r.innerHTML="";r.setAttribute("aria-label",t().within);
  for(const v of RANGES)opt(r,String(v),v===Infinity?t().world:`${t().within} ${nf().format(v)} ${t().km}`,v===state.range);
  const s=document.getElementById("fsort");s.innerHTML="";s.setAttribute("aria-label",t().sortBy);
  opt(s,"new",t().newest,state.sort==="new");opt(s,"near",t().nearest,state.sort==="near");
}
document.getElementById("fcat").onchange=e=>{const v=e.target.value;state.cats=v==="all"?new Set(Object.keys(CATV)):new Set([v]);renderAll()};
document.getElementById("frange").onchange=e=>{const v=e.target.value==="Infinity"?Infinity:+e.target.value;state.range=v;renderAll();v===Infinity?zoomWorld():zoomToKm(v*1.15)};
document.getElementById("fsort").onchange=e=>{state.sort=e.target.value;renderAll();listEl.scrollTop=0};
function renderAll(){
  if(state.sel!==null&&!visible().some(s=>s.id===state.sel)){state.sel=null;gRoute.selectAll("*").remove()}
  renderChips();renderRange();document.querySelectorAll("#sort button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===state.sort)));
  restyle();renderList();drawMarkers();drawLabels();renderStatus();renderDetail();
  document.getElementById("dropn").textContent=`${nf().format(visible().length)}`;
  renderPhoneFilters();
}

/* ---------- data ---------- */
async function load(){
  try{
    const res=await fetch(`/api/stories?lang=${lang}`,{cache:"no-store"});if(!res.ok)throw new Error(res.status);
    const data=await res.json();
    const fresh=new Set();for(const s of data.stories){if(!state.firstLoad&&!state.seen.has(s.id))fresh.add(s.id);state.seen.add(s.id)}
    state.stories=data.stories.map(s=>({...s,_new:fresh.has(s.id)}));
    if(state.group&&state.group.focus){const F=state.group.focus,r=F.kind==="kuwait"?15:150;for(const s of state.stories)if((F.feat?d3.geoContains(F.feat,[s.place.lon,s.place.lat]):hav(F.lat,F.lon,s.place.lat,s.place.lon)<=r)||titleHas(s,F))state.group.ids.add(s.id)}state.sources=data.sources;state.updated=data.updated;state.error=false;
  }catch(e){state.error=!state.stories.length;}
  state.firstLoad=false;renderAll();
}
applyLang();layout();drawBase();svg.call(zoom.transform,TR);renderAll();load();
setInterval(load,POLL_MS);setInterval(renderStatus,30000);
fetch("places.json").then(r=>r.json()).then(p=>{PLACES=p;drawLabels()}).catch(()=>{});
fetch("countries-50m.json").then(r=>r.json()).then(w=>{WORLD=w;drawBase()}).catch(()=>{});
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{layout();drawBase();svg.call(zoom.transform,TR)},120)}).observe(stage);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{renderAll();renderThemeBtn()});
/* ---------- day / night ---------- */
const SUN='<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>';
const MOON='<svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" fill="currentColor"/></svg>';
const isDark=()=>{const a=document.documentElement.dataset.theme;return a?a==="dark":matchMedia("(prefers-color-scheme: dark)").matches};
function renderThemeBtn(){const b=document.getElementById("theme");const d=isDark();b.innerHTML=d?SUN:MOON;
  const l=lang==="ar"?(d?"الوضع النهاري":"الوضع الليلي"):(d?"Day mode":"Night mode");b.setAttribute("aria-label",l);b.title=l}
document.getElementById("theme").onclick=()=>{const next=isDark()?"light":"dark";document.documentElement.dataset.theme=next;
  try{localStorage.setItem("wgo-theme",next)}catch(e){}renderThemeBtn();renderAll()};
renderThemeBtn();
</script>
